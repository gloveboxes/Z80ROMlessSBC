<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>

  <style>
    /* Inlined modern.css */
    html,
    input[type=submit],
    div.find a:active {
      background-color: #4A90E2;
      color: #ffffff;
    }

    a {
      background-color: #4A90E2;
      color: #ffffff;
    }

    a:hover {
      background-color: #357ABD;
      color: #ffffff;
    }

    #docs {
      background-color: #4A90E2;
      border-width: thick;
      border: white;
      font-family: Courier New;
      font-size: 20px;
      padding: 1px 1px;
    }

    input[type=button] {
      background-color: black;
      border-color: #ffffff;
      border-style: solid;
      border-width: thin;
      color: #ffffff;
      cursor: pointer;
      font-family: Courier New;
      font-size: 20px;
      padding: 1px 4px;
      margin: 2px;
    }

    input[type=text] {
      background-color: black;
      border-color: blue;
      border-style: solid;
      border-width: thin;
      color: #ffffff;
      font-family: Courier New;
      font-size: 20px;
      padding: 1px 1px;
      text-decoration: none;
    }

    body {
      background-color: #4A90E2;
      color: #ffffff;
      font-family: Courier New;
      font-size: 20px;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    #terminal {
      display: inline-block;
      width: auto;
      max-width: calc(100vw - 40px);
      border: 2px solid #ffffff;
      box-sizing: border-box;
      /* Keep the scrollbar outside the 80-column terminal canvas. */
      padding: 0 12px 0 0;
      margin: 0 auto;
      overflow: auto;
      background-color: #000;
    }

    /* Inlined xterm.css 5.3.0 to ensure the terminal renders when the page
       is embedded into firmware without external assets. */
    .xterm {
      cursor: text;
      position: relative;
      user-select: none;
      -ms-user-select: none;
      -webkit-user-select: none;
    }

    .xterm.focus,
    .xterm:focus {
      outline: none;
    }

    .xterm .xterm-helpers {
      position: absolute;
      top: 0;
      z-index: 5;
    }

    .xterm .xterm-helper-textarea {
      padding: 0;
      border: 0;
      margin: 0;
      position: absolute;
      opacity: 0;
      left: -9999em;
      top: 0;
      width: 0;
      height: 0;
      z-index: -5;
      white-space: nowrap;
      overflow: hidden;
      resize: none;
    }

    .xterm .composition-view {
      background: #000;
      color: #FFF;
      display: none;
      position: absolute;
      white-space: nowrap;
      z-index: 1;
    }

    .xterm .composition-view.active {
      display: block;
    }

    .xterm .xterm-viewport {
      background-color: #000;
      overflow-y: scroll;
      cursor: default;
      position: absolute;
      right: -12px;
      left: 0;
      top: 0;
      bottom: 0;
      scrollbar-width: thin;
      scrollbar-color: #555 #000;
    }

    .xterm .xterm-viewport::-webkit-scrollbar {
      width: 10px;
    }

    .xterm .xterm-viewport::-webkit-scrollbar-track {
      background: #000;
    }

    .xterm .xterm-viewport::-webkit-scrollbar-thumb {
      background: #555;
      border-radius: 4px;
    }

    .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
      background: #777;
    }

    .xterm .xterm-screen {
      position: relative;
    }

    .xterm .xterm-screen canvas {
      position: absolute;
      left: 0;
      top: 0;
    }

    .xterm .xterm-scroll-area {
      visibility: hidden;
    }

    .xterm-char-measure-element {
      display: inline-block;
      visibility: hidden;
      position: absolute;
      top: 0;
      left: -9999em;
      line-height: normal;
    }

    .xterm.enable-mouse-events {
      cursor: default;
    }

    .xterm.xterm-cursor-pointer,
    .xterm .xterm-cursor-pointer {
      cursor: pointer;
    }

    .xterm.column-select.focus {
      cursor: crosshair;
    }

    .xterm .xterm-accessibility:not(.debug),
    .xterm .xterm-message {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      right: 0;
      z-index: 10;
      color: transparent;
      pointer-events: none;
    }

    .xterm .xterm-accessibility-tree:not(.debug) *::selection {
      color: transparent;
    }

    .xterm .xterm-accessibility-tree {
      user-select: text;
      white-space: pre;
    }

    .xterm .live-region {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
    }

    .xterm-dim {
      opacity: 1 !important;
    }

    .xterm-underline-1 {
      text-decoration: underline;
    }

    .xterm-underline-2 {
      text-decoration: double underline;
    }

    .xterm-underline-3 {
      text-decoration: wavy underline;
    }

    .xterm-underline-4 {
      text-decoration: dotted underline;
    }

    .xterm-underline-5 {
      text-decoration: dashed underline;
    }

    .xterm-overline {
      text-decoration: overline;
    }

    .xterm-overline.xterm-underline-1 {
      text-decoration: overline underline;
    }

    .xterm-overline.xterm-underline-2 {
      text-decoration: overline double underline;
    }

    .xterm-overline.xterm-underline-3 {
      text-decoration: overline wavy underline;
    }

    .xterm-overline.xterm-underline-4 {
      text-decoration: overline dotted underline;
    }

    .xterm-overline.xterm-underline-5 {
      text-decoration: overline dashed underline;
    }

    .xterm-strikethrough {
      text-decoration: line-through;
    }

    .xterm-screen .xterm-decoration-container .xterm-decoration {
      z-index: 6;
      position: absolute;
    }

    .xterm-screen .xterm-decoration-container .xterm-decoration.xterm-decoration-top-layer {
      z-index: 7;
    }

    .xterm-decoration-overview-ruler {
      z-index: 8;
      position: absolute;
      top: 0;
      right: 0;
      pointer-events: none;
    }

    .xterm-decoration-top {
      z-index: 2;
      position: relative;
    }
  </style>

  <script>
    "use strict";

    /**
     * Altair Terminal Web Client
     * Improved version with better error handling, code organization, and robustness
     */
    const AltairTerminal = (function () {
      // Private state - encapsulated to avoid global pollution
      const state = {
        ws: null,
        connected: false,
        online: navigator.onLine,
        term: null,
        reconnectAttempts: 0,
        pasteHandler: null,
        keyHandler: null,
        cleanupInterval: null,
        reconnectTimer: null,
        connectTimeout: null,
        userInitiatedDisconnect: false,
        inputBuffer: [],
        inputTimer: null,
        inputSequence: 1,
        inputFrame: null,
        outputSequence: 1,
        outputReceivedSequence: 1,
        outputPending: 0,
        protocolGeneration: 0,
        protocolReady: false,
        rebootPending: false,
        rebootTimedOut: false,
        rebootDisconnected: false,
        rebootSteps: [],
        rebootTimer: null,
        encoder: new TextEncoder()
      };


      // Configuration constants
      const CONFIG = {
        XTERM_FONT: 'Courier',
        XTERM_FONT_SIZE: 18,
        XTERM_ROWS: 30,
        XTERM_COLS: 80,
        WEBSOCKET_PORT: 8088,
        INPUT_FRAME_BYTES: 64,
        MAX_PENDING_INPUT: 65536,
        INPUT_RETRY_MS: 250,
        PROTOCOL_VERSION: 4,
        OUTPUT_FRAME_BYTES: 512,
        OUTPUT_WINDOW: 4,
        STORAGE_THEME_KEY: 'altair_theme',
        DEFAULT_THEME: 'dark',
        MAX_SCROLLBACK_LINES: 1000,
        BUFFER_CLEANUP_INTERVAL: 300000, // 5 minutes
        RECONNECT_DELAY: 2000,
        MAX_RECONNECT_ATTEMPTS: 5,
        CONNECTION_TIMEOUT: 5000  // 5 second connection timeout
      };

      // DOM element cache
      const elements = {
        terminal: null,
        hostName: null,
        toggleTheme: null,
        reconnectBtn: null,
        sendEscBtn: null,
        sendCtrlCBtn: null,
        error: null,
        rebootBtn: null,
        rebootStatus: null,
        rebootBrand: null,
        rebootText: null,
        monitorBtn: null
      };

      function sendToServer(data) {
        if (!state.connected || !state.online || !state.ws || state.ws.readyState !== WebSocket.OPEN) {
          return;
        }

        try {
          // Convert string to Uint8Array if necessary for binary transmission
          const payload = typeof data === "string" ? state.encoder.encode(data) : data;

          if (payload.byteLength === 0) return false;

          state.ws.send(payload);
          return true;
        } catch (error) {
          console.error("Failed to send data:", error);
          showError("Failed to send data to server");
          return false;
        }
      }

      const PROTOCOL = { OUTPUT: 1, INPUT: 2, OUTPUT_ACK: 3, INPUT_ACK: 4, HELLO: 5, READY: 6, REBOOT: 7, REBOOT_STATUS: 8 };

      function protocolFrame(type, sequence, payload = new Uint8Array()) {
        const frame = new Uint8Array(5 + payload.length);
        frame[0] = type;
        new DataView(frame.buffer).setUint32(1, sequence, true);
        frame.set(payload, 5);
        return frame;
      }

      function updateRebootButton() {
        if (elements.rebootBtn) {
          elements.rebootBtn.disabled = !state.connected || !state.protocolReady || state.rebootPending || state.rebootTimedOut;
          elements.rebootBtn.textContent = state.rebootPending ? 'Rebooting Zeta-80...' : 'Reboot Zeta-80';
        }
      }

      function rebootMessage(message) {
        if (elements.rebootText && elements.rebootBrand) {
          elements.rebootText.textContent = message;
          elements.rebootText.style.display = message ? 'inline' : 'none';
          elements.rebootBrand.hidden = Boolean(message);
          elements.rebootBrand.style.display = message ? 'none' : 'inline-flex';
        } else if (elements.rebootStatus) {
          elements.rebootStatus.textContent = message;
        }
      }

      function rebootProgress(step) {
        if (!state.rebootSteps.includes(step)) state.rebootSteps.push(step);
        rebootMessage(state.rebootSteps.join(' -> ') + '...');
      }

      function finishReboot(message) {
        state.rebootPending = false;
        if (state.rebootTimer !== null) clearTimeout(state.rebootTimer);
        state.rebootTimer = null;
        if (!message) state.rebootSteps = [];
        rebootMessage(message ? [...state.rebootSteps, message].join(' -> ') : '');
        updateRebootButton();
        pumpInput();
      }

      function watchReboot() {
        if (state.rebootTimer !== null) return;
        state.rebootTimer = setTimeout(() => {
          state.rebootTimer = null;
          state.rebootTimedOut = true;
          finishReboot('Reboot not confirmed. Check USB supervisor status before resetting the board.');
        }, 40000);
      }

      function setupRebootButton() {
        if (!elements.rebootBtn) return;
        updateRebootButton();
        elements.rebootBtn.onclick = () => {
          if (!state.connected || !state.protocolReady || state.rebootPending || state.rebootTimedOut) return;
          if (!window.confirm('Reboot Zeta-80? Unsaved application work will be lost. Disks will be flushed before restarting.')) return;
          state.rebootPending = true;
          state.rebootDisconnected = false;
          state.rebootSteps = [];
          // Discard unsent keystrokes; retain the in-flight frame until its ACK.
          if (state.inputTimer !== null) clearTimeout(state.inputTimer);
          state.inputTimer = null;
          state.inputBuffer = state.inputFrame ? state.inputBuffer.slice(0, state.inputFrame.length - 5) : [];
          updateRebootButton();
          rebootMessage('Requesting orderly reboot...');
          if (!sendToServer(protocolFrame(PROTOCOL.REBOOT, 0))) {
            finishReboot('Reboot request could not be sent.');
            return;
          }
          watchReboot();
        };
      }

      function handleRebootStatus(status) {
        if (status === 1 || status === 2 || status === 3) {
          state.rebootPending = true;
          watchReboot();
          rebootProgress(status === 1 ? 'Waiting for Pico supervisor' : status === 3 ? 'Restarting' : 'Flushing disks');
        } else if (status === 4) {
          finishReboot('Reboot cancelled: storage error. Check the USB supervisor log.');
        } else if (status === 5) {
          state.rebootTimedOut = true;
          finishReboot('Reboot timed out. Restart cancelled; check USB supervisor status.');
        } else if (status === 6) {
          finishReboot('Reboot rejected: the supervisor is busy, CP/M is stopped, or storage has failed. Check USB status.');
        } else if (status === 0 || status === 7) {
          state.rebootTimedOut = false;
          if (status === 7 && state.rebootPending && state.rebootDisconnected) finishReboot('');
        }
        updateRebootButton();
      }

      function resetProtocol(reportPending = false) {
        if (state.inputTimer !== null) clearTimeout(state.inputTimer);
        if (reportPending && state.inputBuffer.length) {
          showError(`Connection closed with ${state.inputBuffer.length} input bytes unconfirmed; they will not be replayed.`);
        }
        state.inputTimer = null;
        state.inputBuffer = [];
        state.inputFrame = null;
        state.inputSequence = 1;
        state.outputSequence = 1;
        state.outputReceivedSequence = 1;
        state.outputPending = 0;
        state.protocolGeneration++;
        state.protocolReady = false;
        updateRebootButton();
      }

      function pumpInput() {
        if (!state.protocolReady || !state.connected || state.rebootPending || !state.inputBuffer.length) return;
        if (state.inputTimer !== null) clearTimeout(state.inputTimer);
        if (!state.inputFrame) {
          state.inputFrame = protocolFrame(PROTOCOL.INPUT, state.inputSequence,
            Uint8Array.from(state.inputBuffer.slice(0, CONFIG.INPUT_FRAME_BYTES)));
        }
        sendToServer(state.inputFrame);
        state.inputTimer = setTimeout(() => {
          state.inputTimer = null;
          pumpInput();
        }, CONFIG.INPUT_RETRY_MS);
      }

      function queueInput(data) {
        if (!data || !state.connected || state.rebootPending) return;
        if (!state.protocolReady) {
          showError("Terminal handshake is not complete; please retry this input.");
          return;
        }
        const bytes = typeof data === "string" ? state.encoder.encode(data) : data;
        if (!(bytes instanceof Uint8Array)) return;
        if (state.inputBuffer.length + bytes.length > CONFIG.MAX_PENDING_INPUT) {
          showError("Input queue full (64 KiB); this input was not accepted. Wait for the paste to finish.");
          return;
        }
        for (const byte of bytes) state.inputBuffer.push(byte);
        if (!state.inputFrame) pumpInput();
      }

      function handleProtocolFrame(data, socket) {
        if (socket !== state.ws) return;
        const frame = new Uint8Array(data);
        if (frame.length < 5) throw new Error("Invalid terminal protocol; reload this page.");
        const sequence = new DataView(frame.buffer, frame.byteOffset, frame.byteLength).getUint32(1, true);
        if (frame[0] === PROTOCOL.HELLO && frame.length === 5 && sequence === CONFIG.PROTOCOL_VERSION) {
          state.protocolReady = true;
          if (state.rebootPending && state.rebootDisconnected) finishReboot('');
          updateRebootButton();
          sendToServer(protocolFrame(PROTOCOL.READY, CONFIG.PROTOCOL_VERSION));
          if (!state.inputFrame) pumpInput();
        } else if (frame[0] === PROTOCOL.REBOOT_STATUS && state.protocolReady && frame.length === 5 && sequence <= 7) {
          handleRebootStatus(sequence);
        } else if (frame[0] === PROTOCOL.INPUT_ACK && frame.length === 5) {
          if (state.inputFrame && sequence === state.inputSequence) {
            state.inputBuffer.splice(0, state.inputFrame.length - 5);
            state.inputFrame = null;
            state.inputSequence = (state.inputSequence + 1) >>> 0;
            if (state.inputTimer !== null) clearTimeout(state.inputTimer);
            state.inputTimer = null;
            pumpInput();
          }
        } else if (frame[0] === PROTOCOL.OUTPUT && state.protocolReady &&
                   frame.length > 5 && frame.length <= 5 + CONFIG.OUTPUT_FRAME_BYTES) {
          if (sequence === state.outputReceivedSequence) {
            if (state.outputPending >= CONFIG.OUTPUT_WINDOW) {
              throw new Error("Terminal output window exceeded; reconnect.");
            }
            state.outputReceivedSequence = (sequence + 1) >>> 0;
            state.outputPending++;
            const generation = state.protocolGeneration;
            // Keep at most four writes queued, and ACK only consumed bytes.
            state.term.write(frame.slice(5), () => {
              if (socket !== state.ws || generation !== state.protocolGeneration) return;
              state.outputPending--;
              state.outputSequence = (state.outputSequence + 1) >>> 0;
              sendToServer(protocolFrame(PROTOCOL.OUTPUT_ACK, sequence));
            });
          } else {
            const consumed = (state.outputSequence - sequence) >>> 0;
            const pending = (state.outputReceivedSequence - sequence) >>> 0;
            if (consumed > 0 && consumed < 0x80000000) {
              sendToServer(protocolFrame(PROTOCOL.OUTPUT_ACK, (state.outputSequence - 1) >>> 0));
            } else if (pending === 0 || pending > CONFIG.OUTPUT_WINDOW) {
              throw new Error("Out-of-order terminal output; reconnect.");
            }
          }
        } else {
          throw new Error("Unsupported terminal protocol; reload this page.");
        }
      }

      /**
       * Initialize DOM element references with error checking
       */
      function initializeElements() {
        try {
          elements.terminal = document.getElementById("terminal");
          elements.hostName = document.getElementById("host_name");
          elements.toggleTheme = document.getElementById("toggleTheme");
          elements.reconnectBtn = document.getElementById("reconnectBtn");
          elements.sendEscBtn = document.getElementById("sendEscBtn");
          elements.sendCtrlCBtn = document.getElementById("sendCtrlCBtn");
          elements.error = document.getElementById("terminal_error");
          elements.monitorBtn = document.getElementById("monitorBtn");
          elements.rebootBtn = document.getElementById("rebootZ80Btn");
          elements.rebootStatus = document.getElementById("reboot_status");
          elements.rebootBrand = document.getElementById("reboot_brand");
          elements.rebootText = document.getElementById("reboot_message");

          // Validate critical elements exist
          if (!elements.terminal) {
            throw new Error("Terminal container element not found");
          }
        } catch (error) {
          console.error("Failed to initialize DOM elements:", error);
          showError("Failed to initialize terminal interface");
          return false;
        }
        return true;
      }

      // Add sendCtrlC button click handler
      function setupSendCtrlCButton() {
        if (!elements.sendCtrlCBtn) return;
        elements.sendCtrlCBtn.onclick = function () {
          if (state.connected && state.ws && state.ws.readyState === WebSocket.OPEN) {
            sendControlCharacter(3); // Ctrl+C
          }
          if (state.term) {
            state.term.focus();
          }
        };
      }

      // Add sendEsc button click handler
      function setupSendEscButton() {
        if (!elements.sendEscBtn) return;
        elements.sendEscBtn.onclick = function () {
          if (state.connected && state.ws && state.ws.readyState === WebSocket.OPEN) {
            sendControlCharacter(27); // ESC key
          }
          if (state.term) {
            state.term.focus();
          }
        };
      }

      // Add monitor button click handler
      function setupMonitorButton() {
        if (!elements.monitorBtn) return;
        elements.monitorBtn.onclick = function () {
          if (state.connected && state.ws && state.ws.readyState === WebSocket.OPEN) {
            sendControlCharacter(13);
          }
          if (state.term) {
            state.term.focus();
          }
        };
      }

      /**
       * Safe error display without using alert()
       */
      function showError(message) {
        console.error("Altair Terminal Error:", message);
        if (elements.error) {
          elements.error.textContent = message;
        }
      }

      /**
       * Safe message display
       */
      function showMessage(message, isError = false) {
        console.log("Altair Terminal:", message);
        if (elements.hostName) {
          elements.hostName.textContent = message;
          elements.hostName.style.color = isError ? 'red' : '';
        }
        updateReconnectButton();
      }

      function updateReconnectButton() {
        if (!elements.reconnectBtn) return;

        const isOpen = state.connected && state.ws && state.ws.readyState === WebSocket.OPEN;
        const isConnecting = state.ws && state.ws.readyState === WebSocket.CONNECTING;
        
        elements.reconnectBtn.disabled = isConnecting;  // Disable while connecting
        
        let hostText = "localhost";
        if (state.ws && state.ws.url) {
          try {
            const url = new URL(state.ws.url);
            hostText = url.hostname;
          } catch (e) { }
        } else {
          // Use the host from getWebSocketUrl()
          try {
            const wsUrl = getWebSocketUrl();
            hostText = wsUrl.split('://')[1].split(':')[0];
          } catch (e) { }
        }
        
        if (isConnecting) {
          elements.reconnectBtn.textContent = `Connecting to ${hostText}...`;
        } else if (isOpen) {
          elements.reconnectBtn.textContent = `Disconnect from ${hostText}`;
        } else {
          elements.reconnectBtn.textContent = `Connect to ${hostText}`;
        }

        // Disable/enable control buttons based on connection state
        if (elements.sendEscBtn) elements.sendEscBtn.disabled = !isOpen;
        if (elements.sendCtrlCBtn) elements.sendCtrlCBtn.disabled = !isOpen;
        if (elements.monitorBtn) elements.monitorBtn.disabled = !isOpen;
        updateRebootButton();
      }
      // Add reconnect button click handler
      function setupReconnectButton() {
        if (!elements.reconnectBtn) return;
        elements.reconnectBtn.onclick = function () {
          if (state.connected && state.ws && state.ws.readyState === WebSocket.OPEN) {
            // Disconnect
            state.userInitiatedDisconnect = true;
            closeConnection();
            showMessage('Disconnected', true);
            updateReconnectButton();
          } else {
            // Connect - reset reconnect attempts for fresh start
            state.reconnectAttempts = 0;
            state.userInitiatedDisconnect = false;
            attemptConnection();
            updateReconnectButton();  // Update button immediately to show "Connecting..."
          }
        };
      }

      /**
       * Network status management
       */
      function initializeNetworkHandlers() {
        window.addEventListener('offline', () => {
          console.log('Connection lost');
          state.online = false;
          showMessage('Connection lost', true);
        });

        window.addEventListener('online', () => {
          console.log('Connection restored');
          state.online = true;
          showMessage('Network connection restored');
          // Attempt to reconnect if not currently connected and not user-disconnected
          if (!state.connected && !state.userInitiatedDisconnect) {
            // Reset reconnect attempts when network comes back
            state.reconnectAttempts = 0;
            cancelReconnect();
            setTimeout(() => attemptConnection(), 1000);
          }
        });
      }

      /**
       * Initialize xterm.js terminal with error handling
       */
      function initializeTerminal() {
        try {
          // Check if Terminal is available
          if (typeof Terminal === 'undefined') {
            throw new Error("xterm.js library not loaded");
          }

          // Get initial theme before creating terminal
          const initialTheme = localStorage.getItem(CONFIG.STORAGE_THEME_KEY) || CONFIG.DEFAULT_THEME;
          const themeColors = initialTheme === "light"
            ? {
              background: '#ffffff',
              foreground: "#000000",
              cursor: "#000000",
              selectionBackground: "rgba(188,214,141, 0.4)"
            }
            : {
              background: '#000000',
              foreground: "#ffffff",
              cursor: "#ffffff",
              selectionBackground: "rgba(188,214,141, 0.4)"
            };

          state.term = new Terminal({
            cursorBlink: true,
            fontFamily: CONFIG.XTERM_FONT,
            fontSize: CONFIG.XTERM_FONT_SIZE,
            cols: CONFIG.XTERM_COLS,
            rows: CONFIG.XTERM_ROWS,
            theme: themeColors
          });

          // FitAddon removed to enforce fixed terminal dimensions (80 cols x 30 rows)
          // This prevents the terminal from expanding beyond 30 rows on mobile devices

          if (!elements.terminal) {
            throw new Error("Terminal container not found");
          }

          state.term.open(elements.terminal);

          // Enforce fixed dimensions after opening
          state.term.resize(CONFIG.XTERM_COLS, CONFIG.XTERM_ROWS);

          // Handle window resize - maintain fixed dimensions
          window.addEventListener('resize', () => {
            if (state.term) {
              state.term.resize(CONFIG.XTERM_COLS, CONFIG.XTERM_ROWS);
            }
          });
          updateThemeButton(initialTheme === "light" ? "Dark" : "Light");
          // state.term.write('WELCOME TO ALTAIR TERMINAL');

          // Set up terminal prompt function
          state.term.prompt = (msg) => {
            queueInput(msg);
          };

          state.term.prompt("");
          setupTerminalEventHandlers();

          return true;
        } catch (error) {
          console.error("Failed to initialize terminal:", error);
          showError("Failed to initialize terminal: " + error.message);
          return false;
        }
      }

      function sendControlCharacter(charCode) {
        queueInput(String.fromCharCode(charCode));
      }

      function setupTerminalEventHandlers() {
        if (!state.term) return;

        // Remove existing handlers first to prevent accumulation
        cleanupTerminalEventHandlers();

        // onData handles normal typing and pasting
        state.pasteHandler = state.term.onData((data) => {
          queueInput(data);
        });

        // Intercept special keys before xterm processes them
        state.term.attachCustomKeyEventHandler((ev) => {
          if (ev.type !== 'keydown') return true;

          // CP/M Ctrl-M is carriage return, not the emulator monitor command.
          if (ev.ctrlKey && (ev.key === 'm' || ev.key === 'M')) {
            sendControlCharacter(13);
            return false;
          }

          // Special Altair character mappings
          const ctrlCode = (letter) => letter.charCodeAt(0) & 0x1F;
          const keyMappings = {
            39: ctrlCode('D'), // cursor right -> ctrl D
            37: ctrlCode('S'), // cursor left -> ctrl S
            38: ctrlCode('E'), // cursor up -> ctrl E
            40: ctrlCode('X'), // cursor down -> ctrl X
            45: ctrlCode('O'), // insert -> ctrl O
            46: ctrlCode('G'), // delete -> ctrl G
            33: ctrlCode('R'), // page up -> ctrl R
            34: ctrlCode('V'), // page down -> ctrl V
            8: ctrlCode('H')   // backspace -> ctrl H
          };

          if (keyMappings[ev.keyCode]) {
            sendControlCharacter(keyMappings[ev.keyCode]);
            return false; // Stop xterm from sending its own sequence
          }

          // Let everything else (letters, Enter, ESC) go to onData
          return true;
        });

        // Set focus to terminal after event handlers are set
        state.term.focus();
      }

      function cleanupTerminalEventHandlers() {
        if (state.pasteHandler) {
          try {
            state.pasteHandler.dispose();
          } catch (error) {
            console.error("Error removing paste handler:", error);
          }
        }
        state.pasteHandler = null;
      }

      // No longer used, logic moved to attachCustomKeyEventHandler
      /*
      function handleKeyPress(key, ev) { ... }
      */

      /**
       * Cancel any pending reconnection attempt
       */
      function cancelReconnect() {
        if (state.reconnectTimer) {
          clearTimeout(state.reconnectTimer);
          state.reconnectTimer = null;
        }
      }

      /**
       * Get WebSocket URL with validation
       */
      function getWebSocketUrl() {
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const hostAddress = urlParams.get('altair');

          // Dev Tunnels terminate TLS and route the public hostname to the
          // configured tunnel port, so keep that hostname and omit :8088.
          const pageHostname = window.location.hostname || '';
          if (pageHostname.toLowerCase().endsWith('.devtunnels.ms')) {
            return `wss://${pageHostname}/`;
          }

          // Use same host as page, or override with ?altair= parameter
          const altairAddress = hostAddress
            ? sanitizeHostAddress(hostAddress)
            : window.location.hostname || 'localhost';

          // Pico HTTP and WebSocket share port 8088 at the root path.
          const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
          return `${scheme}://${altairAddress}:${CONFIG.WEBSOCKET_PORT}/`;
        } catch (error) {
          console.error("Failed to construct WebSocket URL:", error);
          const scheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
          return `${scheme}://localhost:${CONFIG.WEBSOCKET_PORT}/`;
        }
      }

      /**
       * Basic host address sanitization
       */
      function sanitizeHostAddress(address) {
        // Remove any protocol prefixes and validate basic format
        const cleaned = address.replace(/^https?:\/\//, '').split('/')[0];
        // Basic validation - allow alphanumeric, dots, hyphens
        if (!/^[a-zA-Z0-9.-]+$/.test(cleaned)) {
          console.warn("Invalid host address, using default");
          return 'localhost';
        }
        return cleaned;
      }

      /**
       * Attempt WebSocket connection with retry logic
       */
      function attemptConnection() {
        // Cancel any pending reconnection attempts and timeouts
        cancelReconnect();
        cancelConnectTimeout();

        // Close existing connection if any
        if (state.ws) {
          closeConnection();
        }

        // Clear the user disconnect flag when manually connecting
        state.userInitiatedDisconnect = false;

        const wsUrl = getWebSocketUrl();
        const altairAddress = wsUrl.split('://')[1].split(':')[0];

        showMessage(`Connecting to ${altairAddress}...`);

        try {
          state.ws = new WebSocket(wsUrl);
          state.ws.binaryType = "arraybuffer";
          setupWebSocketEventHandlers(altairAddress);
          
          // Set connection timeout - if not connected within timeout, abort
          state.connectTimeout = setTimeout(() => {
            if (state.ws && state.ws.readyState === WebSocket.CONNECTING) {
              console.log("Connection timeout - aborting");
              state.ws.close();
              state.ws = null;
              state.connected = false;
              showMessage('Connection timeout', true);
              updateReconnectButton();
              scheduleReconnect();
            }
          }, CONFIG.CONNECTION_TIMEOUT);
          
        } catch (error) {
          console.error("Failed to create WebSocket:", error);
          showError("Failed to create connection");
          state.connected = false;
          updateReconnectButton();
          scheduleReconnect();
        }
      }

      /**
       * Cancel connection timeout
       */
      function cancelConnectTimeout() {
        if (state.connectTimeout) {
          clearTimeout(state.connectTimeout);
          state.connectTimeout = null;
        }
      }

      /**
       * Set up WebSocket event handlers
       */
      function setupWebSocketEventHandlers(altairAddress) {
        if (!state.ws) return;

        // Capture reference to THIS WebSocket instance to prevent race conditions
        // When a new connection is created, old WebSocket events should be ignored
        const thisWs = state.ws;

        state.ws.onopen = () => {
          // Ignore if this is not the current WebSocket
          if (state.ws !== thisWs) {
            console.log("Ignoring onopen from old WebSocket");
            return;
          }
          cancelConnectTimeout();  // Clear connection timeout on success
          console.log("WebSocket connected");
          resetProtocol();
          if (elements.error) elements.error.textContent = "";
          state.connected = true;
          state.reconnectAttempts = 0;  // Reset immediately on successful connection
          showMessage(altairAddress);
          updateReconnectButton();
          if (state.term) {
            state.term.focus();
          }
        };

        state.ws.onmessage = (event) => {
          // Ignore messages from old WebSocket
          if (state.ws !== thisWs) return;

          if (!state.term) {
            return;
          }

          try {
            if (!(event.data instanceof ArrayBuffer)) {
              throw new Error("Expected binary terminal protocol; reload this page.");
            }
            handleProtocolFrame(event.data, thisWs);
          } catch (error) {
            showError(error.message);
            closeConnection();
            updateReconnectButton();
          }
        };

        state.ws.onclose = (event) => {
          console.log("WebSocket closed:", event.code, event.reason);

          // CRITICAL: Only process close if this is still the current WebSocket
          // This prevents a race condition where an old WebSocket's onclose
          // fires after a new WebSocket has been created, nulling out the new reference
          if (state.ws !== thisWs) {
            console.log("Ignoring onclose from old WebSocket");
            return;
          }

          resetProtocol(true);

          // Synchronize state
          state.connected = false;
          state.ws = null;
          updateReconnectButton();

          // Only show message and attempt reconnect if not user initiated
          if (!state.userInitiatedDisconnect) {
            if (state.rebootPending) {
              state.rebootDisconnected = true;
              rebootProgress('Reconnecting');
              scheduleReconnect();
            } else {
              showMessage('Connection closed. Click Connect to reconnect.', true);
            }
            // Outside reboot, require manual reconnect to preserve single-client ownership
          } else {
            showMessage('Disconnected.', true);
            // Reset flag after handling disconnect
            state.userInitiatedDisconnect = false;
          }
        };

        state.ws.onerror = (error) => {
          // Ignore errors from old WebSocket
          if (state.ws !== thisWs) {
            console.log("Ignoring onerror from old WebSocket");
            return;
          }
          console.error("WebSocket error:", error);
          state.connected = false;
          // Don't call scheduleReconnect here - onclose will handle it
          // This prevents double reconnection attempts
        };
      }

      /**
       * Close WebSocket connection cleanly
       */
      function closeConnection() {
        // Cancel any pending reconnection attempts and timeouts
        cancelReconnect();
        cancelConnectTimeout();
        resetProtocol(true);

        if (state.ws) {
          try {
            // Clear event handlers explicitly to prevent memory leaks
            state.ws.onopen = null;
            state.ws.onmessage = null;
            state.ws.onclose = null;
            state.ws.onerror = null;

            // Only close if not already closed/closing
            if (state.ws.readyState === WebSocket.OPEN || state.ws.readyState === WebSocket.CONNECTING) {
              state.ws.close(1000, "Client disconnect");
            }
          } catch (error) {
            console.error("Error closing WebSocket:", error);
          }
          state.ws = null;
        }
        state.connected = false;
      }

      /**
       * Schedule reconnection attempt
       */
      function scheduleReconnect() {
        // Don't schedule if already scheduled or if max attempts reached
        if (state.reconnectTimer) {
          return;
        }

        if (state.reconnectAttempts >= CONFIG.MAX_RECONNECT_ATTEMPTS) {
          showMessage('Max reconnection attempts reached. Click Connect to retry.', true);
          return;
        }

        if (!state.online) {
          showMessage('No network connection.', true);
          return;
        }

        state.reconnectAttempts++;
        const delay = CONFIG.RECONNECT_DELAY * Math.pow(2, state.reconnectAttempts - 1);

        showMessage(`Reconnecting in ${delay / 1000}s... (${state.reconnectAttempts}/${CONFIG.MAX_RECONNECT_ATTEMPTS})`);

        state.reconnectTimer = setTimeout(() => {
          state.reconnectTimer = null;
          if (!state.connected && state.online && !state.userInitiatedDisconnect) {
            attemptConnection();
          }
        }, delay);
      }

      /**
       * Apply dark theme
       */
      function setDarkTheme() {
        try {
          localStorage.setItem(CONFIG.STORAGE_THEME_KEY, "dark");
          if (state.term && state.term.options) {
            state.term.options.theme = {
              background: '#000000',
              foreground: "#ffffff",
              cursor: "#ffffff",
              selectionBackground: "rgba(188,214,141, 0.4)"
            };
          }
          updateThemeButton("Light");
        } catch (error) {
          console.error("Error applying dark theme:", error);
        }
      }

      /**
       * Apply light theme
       */
      function setLightTheme() {
        try {
          localStorage.setItem(CONFIG.STORAGE_THEME_KEY, "light");
          if (state.term && state.term.options) {
            state.term.options.theme = {
              background: '#ffffff',
              foreground: "#000000",
              cursor: "#000000",
              selectionBackground: "rgba(188,214,141, 0.4)"
            };
          }
          updateThemeButton("Dark");
        } catch (error) {
          console.error("Error applying light theme:", error);
        }
      }

      /**
       * Update theme button text
       */
      function updateThemeButton(text) {
        if (elements.toggleTheme) {
          elements.toggleTheme.textContent = text;
        }
      }

      /**
       * Toggle between themes
       */
      function toggleTheme() {
        try {
          const currentTheme = localStorage.getItem(CONFIG.STORAGE_THEME_KEY) || CONFIG.DEFAULT_THEME;

          if (currentTheme === "light") {
            setDarkTheme();
          } else {
            setLightTheme();
          }

          if (state.term) {
            state.term.focus();
          }
        } catch (error) {
          console.error("Error toggling theme:", error);
        }
      }

      /**
       * Start periodic memory cleanup
       */
      function startPeriodicCleanup() {
        // Clear existing interval first
        if (state.cleanupInterval) {
          clearInterval(state.cleanupInterval);
        }

        state.cleanupInterval = setInterval(() => {
          if (state.term && state.connected) {
            try {
              // Log memory usage for monitoring
              logMemoryUsage();

              // Clear excess scrollback buffer
              const buffer = state.term.buffer;
              if (buffer && buffer.lines && buffer.lines.length > CONFIG.MAX_SCROLLBACK_LINES) {
                console.log("Cleaning up terminal buffer - lines:", buffer.lines.length);
                // Clear the terminal display but keep connection
                state.term.clear();
              }
            } catch (error) {
              console.error("Error during periodic cleanup:", error);
            }
          }
        }, CONFIG.BUFFER_CLEANUP_INTERVAL);
      }

      /**
       * Log memory usage for monitoring
       */
      function logMemoryUsage() {
        if (performance.memory) {
          const used = (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(2);
          const total = (performance.memory.totalJSHeapSize / 1024 / 1024).toFixed(2);
          console.log(`Memory - Used: ${used}MB, Total: ${total}MB`);
        }
      }

      /**
       * Cleanup function for page unload
       */
      function cleanup() {
        if (state.rebootTimer !== null) clearTimeout(state.rebootTimer);
        // Stop periodic cleanup
        if (state.cleanupInterval) {
          clearInterval(state.cleanupInterval);
          state.cleanupInterval = null;
        }

        // Cancel any pending reconnection
        cancelReconnect();

        // Clean up terminal event handlers
        cleanupTerminalEventHandlers();

        // Close WebSocket connection
        state.userInitiatedDisconnect = true;
        closeConnection();

        // Dispose terminal
        if (state.term) {
          try {
            state.term.dispose();
          } catch (error) {
            console.error("Error disposing terminal:", error);
          }
          state.term = null;
        }
      }

      /**
       * Initialize the application
       */
      function initialize() {
        try {
          console.log("Initializing Altair Terminal...");

          if (!initializeElements()) {
            return false;
          }


          setupReconnectButton();
          setupSendEscButton();
          setupSendCtrlCButton();
          setupMonitorButton();
          setupRebootButton();
          initializeNetworkHandlers();

          if (!initializeTerminal()) {
            return false;
          }

          attemptConnection();

          // Start periodic memory cleanup
          startPeriodicCleanup();

          // Set up cleanup on page unload
          window.addEventListener('beforeunload', cleanup);

          updateReconnectButton();

          console.log("Altair Terminal initialized successfully");
          return true;
        } catch (error) {
          console.error("Failed to initialize Altair Terminal:", error);
          showError("Initialization failed: " + error.message);
          return false;
        }
      }

      // Public API
      return {
        initialize,
        toggleTheme,
        cleanup
      };
    })();

    // Global functions for HTML onclick handlers (maintained for compatibility)
    function toggleTheme() {
      AltairTerminal.toggleTheme();
    }

    // Initialize when DOM is loaded
    function initTerminal() {
      AltairTerminal.initialize();
    }
  </script>
