<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1324" viewBox="0 0 1280 1324" role="img" aria-labelledby="title description">
  <title id="title">Z80 ROMless SBC: system architecture</title>
  <desc id="description">Phase 10 architecture. A USB serial terminal, a browser terminal over Wi-Fi and internet services connect to core 1 of a Raspberry Pi Pico 2 W, which owns USB, networking, disk writes and saved settings. Bounded queues and the 4 MiB onboard flash sit between the two cores. Core 0 loads the Z80, generates its 20 MHz clock, completes every Z80 I/O cycle with PIO, and services the status OLED and speaker over I2C. Buffers and fixed logic translate between the 3.3 V Pico and the 5 V Z80. The Z80 alone addresses and writes the 128 KiB SRAM, which holds two 64 KiB banks; the Pico never drives the memory bus. Boot has four steps: validate the boot image in flash, feed the Z80 instructions that write its own SRAM, read every byte back for comparison, then reset and run CP/M from SRAM.</desc>
  <defs>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #162b45; }
      .title { font-size: 40px; font-weight: 750; letter-spacing: -1px; }
      .subtitle { font-size: 20px; fill: #536780; }
      .section { font-size: 14px; font-weight: 750; letter-spacing: 2px; }
      .heading { font-size: 22px; font-weight: 750; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .note { font-size: 14px; fill: #536780; }
      .white { fill: #ffffff; }
      .muted { fill: #536780; }
      .blue { fill: #1d5fc0; }
      .teal { fill: #007f79; }
      .orange { fill: #ac530b; }
      .purple { fill: #7644b5; }
      .line { fill: none; stroke: #536780; stroke-width: 2.5; }
      .io { fill: none; stroke: #1d5fc0; stroke-width: 3; }
      .network { fill: none; stroke: #007f79; stroke-width: 3; }
      .storage { fill: none; stroke: #c66a15; stroke-width: 3; }
      .clock { fill: none; stroke: #c66a15; stroke-width: 4; }
      .memory { fill: none; stroke: #7644b5; stroke-width: 4; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#536780"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#1d5fc0"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#007f79"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#c66a15"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7644b5"/></marker>
  </defs>

  <path fill="#f6f8fc" d="M0 0H1280V1324H0Z"/>
  <path fill="#162b45" d="M0 0H1280V8H0Z"/>
  <text x="40" y="66" class="title">Z80 ROMless SBC</text>
  <text x="40" y="101" class="subtitle">A real Z80 runs CP/M from SRAM. A dual-core Pico 2 W provides the clock, boot, I/O, storage and networking.</text>
  <rect x="1040" y="36" width="200" height="36" rx="18" fill="#e5eaf4"/>
  <text x="1140" y="60" class="section" text-anchor="middle">PHASE 10 FIRMWARE</text>

  <!-- Terminals and services reach the Z80 only through core 1. -->
  <rect x="40" y="135" width="380" height="100" rx="14" fill="#ffffff" stroke="#b5cef2" stroke-width="2"/>
  <text x="62" y="163" class="section blue">USB HOST</text>
  <text x="62" y="193" class="heading">Serial terminal</text>
  <text x="62" y="220" class="small">Console, setup and diagnostics</text>

  <rect x="450" y="135" width="380" height="100" rx="14" fill="#ffffff" stroke="#aad8cd" stroke-width="2"/>
  <text x="472" y="163" class="section teal">WI-FI CLIENT</text>
  <text x="472" y="193" class="heading">Browser terminal</text>
  <text x="472" y="220" class="small">xterm.js over a WebSocket</text>

  <rect x="860" y="135" width="380" height="100" rx="14" fill="#ffffff" stroke="#aad8cd" stroke-width="2"/>
  <text x="882" y="163" class="section teal">INTERNET</text>
  <text x="882" y="193" class="heading">Network services</text>
  <text x="882" y="220" class="small">Time, weather, chat, file transfer</text>

  <!-- Pico boundary: core ownership, the queues between the cores and onboard flash. -->
  <rect x="40" y="275" width="1200" height="462" rx="18" fill="#ffffff" stroke="#b9c8dc" stroke-width="2"/>
  <path d="M58 275H92V737H58Q40 737 40 719V293Q40 275 58 275Z" fill="#162b45"/>
  <text transform="translate(73 506) rotate(-90)" class="section white" text-anchor="middle">RASPBERRY PI PICO 2 W</text>

  <path d="M230 235V299" class="io" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <text x="244" y="262" class="small blue">USB</text>
  <path d="M640 235V299" class="network" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/>
  <text x="654" y="262" class="small teal">Wi-Fi</text>
  <path d="M1050 235V299" class="network" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/>
  <text x="1064" y="262" class="small teal">Wi-Fi</text>

  <rect x="116" y="299" width="1100" height="110" rx="14" fill="#eaf8f4" stroke="#aad8cd" stroke-width="2"/>
  <text x="138" y="333" class="heading teal">Core 1 · Connectivity and storage</text>
  <text x="138" y="363" class="body">USB console and supervisor commands  ·  Wi-Fi, web page and WebSocket terminal</text>
  <text x="138" y="390" class="body">Time, weather, chat and file-transfer clients  ·  Disk writes and saved settings</text>

  <rect x="116" y="461" width="524" height="90" rx="14" fill="#f2f4fa" stroke="#cbd3e3" stroke-width="2"/>
  <text x="138" y="495" class="heading">Bounded queues</text>
  <text x="138" y="525" class="small">Console bytes, disk writes, service requests</text>
  <path d="M378 409V461" class="io" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <path d="M378 551V603" class="io" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>

  <rect x="690" y="461" width="526" height="90" rx="14" fill="#fff6e8" stroke="#e5c38c" stroke-width="2"/>
  <text x="712" y="495" class="heading orange">Onboard flash · 4 MiB</text>
  <text x="712" y="525" class="small">Firmware, boot image, drives A–D, settings</text>
  <path d="M953 409V461" class="storage" marker-start="url(#orange-arrow)" marker-end="url(#orange-arrow)"/>
  <text x="967" y="441" class="note">Disk writes, settings</text>
  <path d="M953 551V603" class="storage" marker-end="url(#orange-arrow)"/>
  <text x="967" y="583" class="note">Boot image, disk reads</text>

  <rect x="116" y="603" width="1100" height="110" rx="14" fill="#edf4ff" stroke="#b5cef2" stroke-width="2"/>
  <text x="138" y="637" class="heading blue">Core 0 · Z80 real-time control</text>
  <text x="138" y="667" class="body">ROMless boot loader  ·  20 MHz Z80 clock  ·  PIO completes every Z80 IN and OUT cycle</text>
  <text x="138" y="694" class="body">Virtual ports for console, disk, services, timers and sound  ·  Status display</text>

  <!-- Board hardware: only buffered signals cross between the Pico and the Z80. -->
  <path d="M200 713V797" class="clock" marker-end="url(#orange-arrow)"/>
  <text x="214" y="774" class="small orange">20 MHz clock</text>
  <path d="M520 713V797" class="io" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <text x="534" y="774" class="small blue">Boot instructions, I/O data, control</text>
  <path d="M1060 713V797" class="network" marker-start="url(#teal-arrow)" marker-end="url(#teal-arrow)"/>
  <text x="1074" y="774" class="small teal">I²C</text>

  <rect x="40" y="797" width="800" height="110" rx="14" fill="#edf4ff" stroke="#b5cef2" stroke-width="2"/>
  <text x="62" y="832" class="heading">Buffers and fixed logic</text>
  <text x="62" y="861" class="body">Level translation between 3.3 V and 5 V; WAIT# holds each I/O cycle</text>
  <text x="62" y="887" class="note">74AHCT244  ·  74AHCT245  ·  74LVC244  ·  74LVC245  ·  74HCT32</text>

  <rect x="880" y="797" width="360" height="110" rx="14" fill="#ffffff" stroke="#aad8cd" stroke-width="2"/>
  <text x="902" y="832" class="heading">Status OLED and speaker</text>
  <text x="902" y="861" class="small">IP address, uptime, heartbeat</text>
  <text x="902" y="887" class="note">Optional ATtiny85 sound engine</text>

  <path d="M280 907V967" class="io" marker-start="url(#blue-arrow)" marker-end="url(#blue-arrow)"/>
  <text x="294" y="944" class="small blue">Clock, I/O data, control</text>
  <path d="M800 907V967" class="line" marker-end="url(#arrow)"/>
  <text x="786" y="944" class="small muted" text-anchor="end">Bank select, read inhibit</text>

  <rect x="40" y="967" width="480" height="110" rx="14" fill="#ffffff" stroke="#b9c8dc" stroke-width="2"/>
  <text x="62" y="1002" class="heading">Z84C0020 Z80 CPU</text>
  <text x="62" y="1031" class="body">Runs CP/M and its applications directly</text>
  <text x="62" y="1057" class="body">Alone addresses and writes SRAM</text>

  <rect x="760" y="967" width="480" height="110" rx="14" fill="#f3eefb" stroke="#cdbbe7" stroke-width="2"/>
  <text x="782" y="1002" class="heading">128 KiB SRAM</text>
  <text x="782" y="1031" class="body">Two 64 KiB banks in one address window</text>
  <text x="782" y="1057" class="body">A port write selects the bank</text>

  <path d="M520 1022H760" class="memory" marker-start="url(#purple-arrow)" marker-end="url(#purple-arrow)"/>
  <text x="640" y="1004" class="small purple" text-anchor="middle" font-weight="700">Direct memory bus</text>
  <text x="640" y="1048" class="note" text-anchor="middle">The Pico never drives it</text>

  <!-- ROMless boot: the Z80 writes and verifies its own image. -->
  <text x="40" y="1124" class="section">ROMLESS BOOT</text>
  <rect x="40" y="1142" width="282" height="100" rx="14" fill="#ffffff" stroke="#b9c8dc" stroke-width="2"/>
  <circle cx="72" cy="1174" r="16" fill="#1d5fc0"/><text x="72" y="1180" class="small white" text-anchor="middle">1</text>
  <text x="98" y="1181" class="heading">Validate</text>
  <text x="62" y="1209" class="small">Recover storage; check the</text>
  <text x="62" y="1230" class="small">boot image held in flash</text>

  <rect x="346" y="1142" width="282" height="100" rx="14" fill="#edf4ff" stroke="#b5cef2" stroke-width="2"/>
  <circle cx="378" cy="1174" r="16" fill="#1d5fc0"/><text x="378" y="1180" class="small white" text-anchor="middle">2</text>
  <text x="404" y="1181" class="heading">Load</text>
  <text x="368" y="1209" class="small">Pico feeds instructions;</text>
  <text x="368" y="1230" class="small">the Z80 writes its SRAM</text>

  <rect x="652" y="1142" width="282" height="100" rx="14" fill="#edf4ff" stroke="#b5cef2" stroke-width="2"/>
  <circle cx="684" cy="1174" r="16" fill="#1d5fc0"/><text x="684" y="1180" class="small white" text-anchor="middle">3</text>
  <text x="710" y="1181" class="heading">Verify</text>
  <text x="674" y="1209" class="small">The Z80 reads SRAM back;</text>
  <text x="674" y="1230" class="small">the Pico checks every byte</text>

  <rect x="958" y="1142" width="282" height="100" rx="14" fill="#f3eefb" stroke="#cdbbe7" stroke-width="2"/>
  <circle cx="990" cy="1174" r="16" fill="#7644b5"/><text x="990" y="1180" class="small white" text-anchor="middle">4</text>
  <text x="1016" y="1181" class="heading">Run</text>
  <text x="980" y="1209" class="small">Reset and start the clock;</text>
  <text x="980" y="1230" class="small">CP/M runs from SRAM</text>

  <path d="M322 1192H346" class="line" marker-end="url(#arrow)"/>
  <path d="M628 1192H652" class="line" marker-end="url(#arrow)"/>
  <path d="M934 1192H958" class="line" marker-end="url(#arrow)"/>

  <text x="40" y="1278" class="note">Blue: Z80 control, I/O and USB  |  Teal: network and I²C  |  Orange: clock and flash  |  Purple: memory bus  |  # = active LOW</text>
  <text x="40" y="1300" class="note">20 MHz is the configured Z80 clock; qualify timing on your own build.</text>
</svg>
